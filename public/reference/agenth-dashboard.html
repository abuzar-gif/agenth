let data;try{data=JSON.parse(localStorage.getItem('agenth_ref_v3'))}catch{}if(!data||!Array.isArray(data.agents))data={agents:initial,selected:'chief',messages:{},tasks:{},prefs:{appearance:'Light',language:'Auto - match my language',suggestions:true,approval:true},connections:{}};for(const a of data.agents){if(!data.messages[a.id])data.messages[a.id]=[{role:'assistant',text:a.intro}]};let tab='Chat',modal='',settingsTab='General',filter='All',search='',color='#a47a53',shape='round',newName='',editId=null,connectSearch='';const $=s=>document.querySelector(s),save=()=>localStorage.setItem('agenth_ref_v3',JSON.stringify(data));function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2800)}function avatar(a,size=56){return `<div class="bot ${a.shape||'round'}" style="--bot:${a.color};--eye:${a.eye||((a.color==='#f1f0eb')?'#111':'#fff')};width:${size}px;height:${size}px;min-width:${size}px"><div class="eyes"><i class="eye"></i><i class="eye"></i></div></div>`}function current(){return data.agents.find(a=>a.id===data.selected)||data.agents[0]}function render(){let a=current(),q=search.toLowerCase();$('#root').innerHTML=`<div class="app"><aside class="side"><div class="profile"><div class="initial">I</div><div class="who"><b>Irum</b><small>irum75345@gmail.com</small></div><button class="square" title="Settings" onclick="openModal('settings')">⚙</button><button class="square" title="Preferences" onclick="openModal('settings');setSettings('General')">☷</button><button class="square" title="Sign out demo" onclick="toast('Standalone demo: no login session')">⊘</button></div><div class="search"><input placeholder="Search" value="${esc(search)}" oninput="search=this.value;renderAgentsOnly()"><button title="New Agent" onclick="openCreate()">+</button></div><div class="agentlist" id="agentlist">${agentList(q)}</div><div class="connectSide"><div class="muted">Connectors</div><div class="connectorLink" onclick="openModal('connect')"><div class="ci" style="background:#e5f8ed">◉</div><div><strong>WhatsApp</strong><small>${data.connections.WhatsApp?'Connected':'Not connected'}</small></div></div><div class="connectorLink" onclick="openModal('market')"><div class="ci">♙</div><div><strong>Bot Marketplace</strong><small>Hire a bot</small></div></div></div><div class="bottom"><button class="pillBottom" onclick="openModal('connect')">▦ &nbsp; Connect apps</button></div></aside><main class="main"><header class="top">${avatar(a,48)}<h1>${esc(a.name)}</h1><span class="status">idle</span><div class="switch"><button class="${tab==='Chat'?'sel':''}" onclick="tab='Chat';render()">Chat</button><button class="${tab==='To-Do'?'sel':''}" onclick="tab='To-Do';render()">To-Do</button></div><span class="green"></span><span class="tokensText">${(data.messages[a.id]||[]).reduce((n,m)=>n+m.text.split(/\s+/).length,0).toLocaleString()} tokens in this chat</span><button class="outline" onclick="openModal('tokens')">Tokens</button><button class="outline" title="Share conversation" onclick="openModal('share')">♧</button></header>${tab==='Chat'?chatHTML(a):todoHTML(a)}</main></div>${modal?modalHTML():''}`;wireAvatars();if(tab==='Chat'){let m=$('.messages');if(m)m.scrollTop=m.scrollHeight}}function agentList(q){return data.agents.filter(a=>a.name.toLowerCase().includes(q)||(a.intro||'').toLowerCase().includes(q)).map(a=>`<button class="agent ${a.id===data.selected?'active':''}" onclick="data.selected='${a.id}';tab='Chat';save();render()">${avatar(a)}<span class="details"><strong>${esc(a.name)}</strong><small>${esc(a.intro.slice(0,34))}...</small></span></button>`).join('')}function renderAgentsOnly(){let l=$('#agentlist');if(l){l.innerHTML=agentList(search.toLowerCase());wireAvatars()}}function chatHTML(a){return `<div class="chatwrap"><div class="messages">${(data.messages[a.id]||[]).map(m=>m.role==='user'?`<div class="message user">${esc(m.text)}</div>`:`<div class="message assistant"><div class="by">${esc(a.name)}</div>${esc(m.text)}<div class="actions"><button class="square" title="Copy" onclick="copyText(this)">▢</button><button class="square" title="Expand" onclick="this.closest('.message').style.maxHeight='none'">⤢</button></div></div>`).join('')}</div><form class="composer" onsubmit="sendMessage(event)"><button type="button" title="Add attachment" onclick="toast('Attachment upload requires backend integration')">＋</button><textarea id="messageInput" placeholder="Ask AgentH" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.form.requestSubmit()}"></textarea><button type="button" title="Voice input" onclick="toast('Microphone transcription requires speech integration')">♩</button><button type="submit" class="voice" title="Send">➤</button></form></div>`}function todoHTML(a){return `<div class="todos">${['Agent\'s To-Do','Your To-Do'].map((name,i)=>{let key=a.id+'_'+i,items=data.tasks[key]||[];return `<div class="todocol"><h3>${name}</h3><p>${i?'Requests that came to you on WhatsApp, and things you add by hand. Use Reassign to hand one to an agent.':'What your agents are doing on their own - scheduled jobs like a daily post - plus tasks you hand to them with Reassign.'}</p><form class="taskform" onsubmit="addTask(event,'${key}')"><input placeholder="${i?'Add something for yourself...':'Add a task for the agent...'}" required><button class="black">+</button></form>${items.length?items.map((t,j)=>`<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${key}',${j})"><span>${esc(t.text)}</span><button onclick="deleteTask('${key}',${j})">×</button></div>`).join(''):'<div class="empty">Nothing here yet.</div>'}</div>`}).join('')}</div>`}function addTask(e,k){e.preventDefault();let v=e.target.querySelector('input').value.trim();if(v){(data.tasks[k]??=[]).push({text:v,done:false});save();render()}}function toggleTask(k,j){data.tasks[k][j].done=!data.tasks[k][j].done;save();render()}function deleteTask(k,j){data.tasks[k].splice(j,1);save();render()}function sendMessage(e){e.preventDefault();let input=$('#messageInput'),text=input.value.trim();if(!text)return;let a=current();data.messages[a.id].push({role:'user',text});let response=a.reply+'\n\nThis is a frontend-only demo. Connect your existing AI chat API for generated answers.';data.messages[a.id].push({role:'assistant',text:response});save();render()}function copyText(btn){let t=btn.closest('.message').innerText;navigator.clipboard?.writeText(t).then(()=>toast('Copied')).catch(()=>toast('Copy unavailable'))}function openModal(m){modal=m;render()}function closeModal(){modal='';render()}function setSettings(t){settingsTab=t;render()}function settingToggle(k){data.prefs[k]=!data.prefs[k];save();render()}function setPref(k,v){data.prefs[k]=v;save();render()}function modalHTML(){return `<div class="shade" onclick="if(event.target===this)closeModal()"><div class="modal ${modal==='settings'?'settings':modal==='connect'||modal==='market'?'submodal':modal==='create'?'create':'smallmodal'}"><button class="close" onclick="closeModal()">×</button>${modal==='settings'?settingsHTML():modal==='connect'?connectHTML():modal==='market'?marketHTML():modal==='create'?createHTML():modal==='share'?shareHTML():modal==='tokens'?tokensHTML():''}</div></div>`}function settingsHTML(){let names=[['⚙','General'],['♙','Your information'],['▣','Computer'],['✉','Email'],['▣','Vault'],['▥','Usage & Billing'],['⇩','Updates']];return `<nav class="settingsnav">${names.map(([ic,n])=>`<button class="navitem ${settingsTab===n?'selected':''}" onclick="setSettings('${n}')"><span>${ic}</span>${n}</button>`).join('')}</nav><section class="settingsbody"><h2>${esc(settingsTab)}</h2>${settingsContent()}</section>`}function toggleHTML(k){return `<button class="toggle ${data.prefs[k]?'on':''}" role="switch" aria-checked="${!!data.prefs[k]}" onclick="settingToggle('${k}')"></button>`}function settingsContent(){if(settingsTab==='General')return `<div class="panel"><div class="settingrow"><div><div class="title">Appearance</div><div class="desc">Dark, light, or follow this device.</div></div><select onchange="setPref('appearance',this.value)">${['Light','Dark','System'].map(x=>`<option ${data.prefs.appearance===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="settingrow"><div><div class="title">Reply language</div><div class="desc">The language all your agents reply in, on the website and WhatsApp.</div></div><select onchange="setPref('language',this.value)">${['Auto - match my language','English','Roman Urdu','Urdu'].map(x=>`<option ${data.prefs.language===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="settingrow"><div><div class="title">Suggestions from Chief</div><div class="desc">Chief looks at your calendar, store and inbox and suggests ways to help.</div></div>${toggleHTML('suggestions')}</div><div class="settingrow"><div><div class="title">Notifications on this device</div><div class="desc">Get Chief’s suggestions as notifications, even when AgentH is closed.</div></div><button class="outline" onclick="requestNotification()">Turn on</button></div><div class="settingrow"><div><div class="title">Show me messages before sending</div><div class="desc">Agents show every WhatsApp message or email to other people and wait for your OK.</div></div>${toggleHTML('approval')}</div></div>`;if(settingsTab==='Email')return `<div class="panel"><div class="title" style="font-size:22px">Claim your agent's email address</div><p style="font-size:18px;color:#777;line-height:1.5">Your agents use it to sign up for services, receive verification emails and contact businesses or schedule with people for you. Nothing is ever sent without you pressing Send.</p><div style="display:flex;align-items:center;gap:12px"><input class="field" value="irum" style="flex:1"><span style="font-size:20px;color:#777">@agenth.net</span></div><button class="black" style="margin-top:40px" onclick="toast('Domain email claiming requires your own mail backend')">Claim address</button></div>`;if(settingsTab==='Vault')return `<div class="filters"><button class="filter on">All 0</button><button class="filter">Logins 0</button><button class="filter">Cards 0</button><button class="filter">Contact info 0</button><button class="filter" style="margin-left:auto" onclick="toast('Secure vault requires encrypted backend; no sensitive data saved in demo')">＋ Add</button></div><div class="panel" style="text-align:center;padding:75px;color:#777;font-size:19px">Nothing saved here yet. Tap “+ Add”.</div><p style="color:#777;font-size:18px;line-height:1.5">Add them once and your agents remember them. Passwords and card numbers require encryption and must never be exposed to the AI.</p>`;if(settingsTab==='Your information')return `<div class="panel"><div class="settingrow"><div><div class="title">Name</div><div class="desc">Irum</div></div><button class="outline" onclick="toast('Profile backend required')">Edit</button></div><div class="settingrow"><div><div class="title">Email</div><div class="desc">irum75345@gmail.com</div></div></div></div>`;return `<div class="panel"><p style="font-size:18px;color:#777">${esc(settingsTab)} requires a connected backend to display live information.</p></div>`}async function requestNotification(){if(!('Notification' in window)){toast('Notifications not supported');return}try{let r=await Notification.requestPermission();toast('Notification permission: '+r)}catch{toast('Notification permission unavailable')}}function connectHTML(){let f=connectors.filter(c=>(filter==='All'||c[1]===filter)&&c[0].toLowerCase().includes(connectSearch.toLowerCase()));return `<h2>Connect Apps</h2><div class="sub">Link an account once - agents then act through it directly, no browser needed.</div><p style="color:#777">${Object.values(data.connections).filter(Boolean).length} connected</p><input class="connectorSearch" placeholder="Search connectors..." value="${esc(connectSearch)}" oninput="connectSearch=this.value;render()"><div class="filters">${['All','Messaging','Email','Social','Freelance','MCP'].map(x=>`<button class="filter ${filter===x?'on':''}" onclick="filter='${x}';render()">${x}</button>`).join('')}</div><div class="connectgrid">${f.map(([n,cat,c,ic])=>`<div class="connectcard"><div class="brand" style="background:${c}">${ic}</div><div class="info"><strong>${esc(n)}</strong><small>${cat}</small></div><button class="black" onclick="connectorClick('${esc(n)}')">${data.connections[n]?'Connected':'Connect'}</button></div>`).join('')}</div><p class="note">Connector cards are reference UI; OAuth and actual connection require server configuration.</p>`}function connectorClick(n){toast(n+': configure a real OAuth/MCP integration in your backend; no fake connection created')}function marketHTML(){let items=[['M','My Personal AI Bot','Your own personal AI assistant - ask it anything, same as chatting with AgentH directly.',10],['T','Tech Visionary Bot','A bold, big-picture thinking partner for tech, startups and innovation.',5],['F','Finance Mentor Bot','A practical mentor for budgeting, saving, investing basics and money mindset.',5],['L','Leadership Coach Bot','A thoughtful coach for leadership, team management and difficult conversations.',5]];return `<h2>Bot Marketplace</h2><div class="sub">Hire a specialist AI bot for a monthly subscription - manage or cancel anytime.</div>${items.map(([ic,n,d,p])=>`<div class="marketcard"><div class="letter">${ic}</div><div class="info"><strong>${n}</strong><p>${d}</p><p>$${p}/month</p></div><button class="black" onclick="toast('Payments are not configured in this demo')">Hire — $${p}/mo</button></div>`).join('')}` }function shareHTML(){return `<h2>Share this conversation</h2><p>Invite other approved AgentH accounts to watch this conversation live and message the agent alongside you. Your own virtual computer and WhatsApp stay in control.</p><p style="margin:35px 0">Nobody's been invited to this one yet.</p><form onsubmit="event.preventDefault();toast('Invitations require authenticated backend')" style="display:flex;gap:10px"><input type="email" required placeholder="teammate's AgentH email"><button class="black">Invite</button></form><p style="font-size:14px">They need to have signed into AgentH at least once already.</p>`}function tokensHTML(){return `<h2>Tokens</h2><p>This standalone preview estimates tokens using word counts. Real token usage and billing must come from your model provider.</p>`}function openCreate(id=null){editId=id;let a=id?data.agents.find(a=>a.id===id):null;color=a?.color||'#a47a53';shape=a?.shape||'round';newName=a?.name||'';openModal('create')}function createHTML(){let colors=['#000000','#a47a53','#f0473d','#ff6c24','#ffb12f','#36c98a','#2bbca6','#2c8cff','#a879f9','#f553ae','#a4a4a4'];return `<div id="previewAvatar">${avatar({color,shape},58)}</div><h3>${editId?'Edit Agent':'New Agent'}</h3><div class="swatches">${colors.map(c=>`<button class="swatch ${color===c?'chosen':''}" style="background:${c}" onclick="color='${c}';render()"></button>`).join('')}</div><div style="margin:12px"><label style="text-align:center">Custom color <input type="color" value="${color}" onchange="color=this.value;render()" style="vertical-align:middle"></label></div><div class="shapes">${['round','soft','squircle','blob','cloud','tilt'].map(s=>`<button title="${s}" class="shape ${shape===s?'chosen':''}" style="border-radius:${s==='round'?'50%':s==='soft'?'20%':s==='squircle'?'35%':s==='blob'?'40% 60% 40% 55%':s==='cloud'?'50% 40% 55% 45%':'20% 40% 20% 30%'}" onclick="shape='${s}';render()"></button>`).join('')}</div><label>Name</label><input type="text" id="agentName" placeholder="New Agent" value="${esc(newName)}" oninput="newName=this.value"><button class="start" onclick="createAgent()">${editId?'Save changes':'Get started'}</button><label>Suggestions</label><div class="suggestions"><button onclick="newName='Research Assistant';$('#agentName').value=newName">🩷 &nbsp; Research Assistant<small>Looks things up and summarizes what it finds</small></button><button onclick="newName='Social Poster';$('#agentName').value=newName">🟠 &nbsp; Social Poster<small>Drafts and posts updates to your socials</small></button></div>${editId?`<button class="start" onclick="deleteAgent()">Delete Agent</button>`:''}` }function createAgent(){let name=$('#agentName').value.trim();if(!name){toast('Enter an agent name');return}if(editId){let a=data.agents.find(x=>x.id===editId);a.name=name;a.color=color;a.shape=shape}else{let id='a'+Date.now();data.agents.push({id,name,color,shape,intro:'Your new agent is ready to configure.',reply:'Configure a real AI backend to chat with this agent.'});data.messages[id]=[{role:'assistant',text:'Your new agent is ready to configure.'}];data.selected=id}save();closeModal();toast(editId?'Agent updated':'Agent created')}function deleteAgent(){if(!editId||!confirm('Delete this agent?'))return;data.agents=data.agents.filter(a=>a.id!==editId);delete data.messages[editId];data.selected=data.agents[0].id;save();closeModal()}function wireAvatars(){document.querySelectorAll('.bot').forEach(el=>{el.onmouseenter=()=>el.classList.add('hovering');el.onmousemove=e=>{let r=el.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);el.style.setProperty('--ex',(Math.max(-1,Math.min(1,x))*4)+'px');el.style.setProperty('--ey',(Math.max(-1,Math.min(1,y))*3)+'px')};el.onmouseleave=()=>{el.classList.remove('hovering');el.style.setProperty('--ex','0px');el.style.setProperty('--ey','0px')}})}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});render();
</script></body></html>
